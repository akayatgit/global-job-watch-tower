# Optional: use Docker for Postgres + Redis if Docker is installed.
# On machines without Docker, ./start_pilot.sh runs conda-installed
# postgres/redis locally instead — same ports, same credentials.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: jobengine
      POSTGRES_PASSWORD: jobengine
      POSTGRES_DB: jobengine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
