# Watch Tower v0 backup stack (API + Postgres + Redis).
# Browser scrape still prefers the host Chrome profile; this compose
# preserves Akay's application brain and data services as images/volumes.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobengine
      POSTGRES_PASSWORD: jobengine
      POSTGRES_DB: jobengine
    volumes:
      - wt_pgdata:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobengine"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  api:
    image: watch-tower:v0
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://jobengine:jobengine@db:5432/jobengine
      REDIS_URL: redis://redis:6379/0
      HEADLESS: "true"
      RELEVANCE_MODE: keyword
    ports:
      - "8002:8001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  wt_pgdata:
