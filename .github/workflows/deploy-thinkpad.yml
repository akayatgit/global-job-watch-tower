name: Deploy ThinkPad

# Public repo safety: only push to main — never pull_request / forks.
on:
  push:
    branches: [main]

concurrency:
  group: watch-tower-thinkpad-deploy
  cancel-in-progress: false

jobs:
  # JobMaster contract suite (documents/jobmaster-telegram-validation.md,
  # kanban card #7). Runs on a GitHub-hosted runner so a code regression is
  # caught before it ever reaches the self-hosted ThinkPad deploy job below —
  # not just diagnosed after the fact via post-deploy diagnostics.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: job_engine/requirements.txt
      # Full app dependencies — test modules import app code (sqlalchemy,
      # celery, fastapi). Installing only python-dotenv made every test file
      # with a real import fail as unittest.loader._FailedTest, which gated
      # ALL deploys from 2026-08-08 to 2026-08-13 (the tower ran Aug 7 code
      # while the engine outage could not be recovered remotely).
      - name: Install test dependencies
        run: pip install -r job_engine/requirements.txt
      - name: Run JobMaster contract suite
        run: |
          cd job_engine
          python -m unittest discover -s tests -v

  deploy:
    needs: test
    runs-on: [self-hosted, watch-tower]
    timeout-minutes: 30
    steps:
      # This step's commands come from the commit that triggered this run
      # (GitHub evaluates workflow YAML server-side), so it runs even when
      # scripts/deploy_local.sh on the runner's disk is still the stale,
      # not-yet-pulled copy. Without this, a dirty cron-regenerated file can
      # wedge deploy_local.sh's own safety check forever: the check aborts
      # before the fetch/reset that would ever land its own fix.
      # See documents/deploy-verification.md (2026-08-02..08-04 incident).
      - name: Clear known-disposable local drift (cron-regenerated files)
        run: |
          cd /home/user/Documents
          git checkout -- documents/briefs 2>/dev/null || true
      - name: Deploy Watch Tower
        run: |
          cd /home/user/Documents
          git fetch origin main
          git show "${GITHUB_SHA}:scripts/deploy_local.sh" > /tmp/watch-tower-deploy.sh
          chmod 700 /tmp/watch-tower-deploy.sh
          WATCH_TOWER_ROOT=/home/user/Documents bash /tmp/watch-tower-deploy.sh
      # Redacted JobMaster/legacy-Hermes state so remote Telegram debugging
      # never needs a terminal on the ThinkPad.
      - name: JobMaster Telegram diagnostics (redacted)
        if: always()
        run: |
          cd /home/user/Documents
          git show "${GITHUB_SHA}:scripts/hermes_diagnostics.sh" > /tmp/watch-tower-diagnostics.sh
          chmod 700 /tmp/watch-tower-diagnostics.sh
          bash /tmp/watch-tower-diagnostics.sh
